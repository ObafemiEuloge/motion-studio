  <script>
    (function () {
      // Les cinq étages de la tour, fenêtres comprises
      const NS = "http://www.w3.org/2000/svg";
      const etages = document.getElementById("m-etages");
      const lum = [];
      for (let k = 1; k <= 5; k++) {
        const y = 1110 - 62 * k;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 700); r.setAttribute("y", y); r.setAttribute("width", 260); r.setAttribute("height", 62);
        r.setAttribute("class", "t plein");
        etages.appendChild(r);
        for (let j = 0; j < 4; j++) {
          const w = document.createElementNS(NS, "rect");
          w.setAttribute("x", 720 + 60 * j); w.setAttribute("y", y + 16); w.setAttribute("width", 40); w.setAttribute("height", 30); w.setAttribute("rx", 3);
          w.setAttribute("class", "t");
          etages.appendChild(w);
          const l = document.createElementNS(NS, "rect");
          l.setAttribute("x", 725 + 60 * j); l.setAttribute("y", y + 21); l.setAttribute("width", 30); l.setAttribute("height", 20); l.setAttribute("rx", 2);
          l.setAttribute("class", "lum m-lum");
          etages.appendChild(l);
          lum.push(l);
        }
      }

      const tl = gsap.timeline({ paused: true });
      const scene = "#m-scene";

      // État de départ
      tl.fromTo(lum, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#m-rature", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 100% 0 0)", duration: 0.01 }, 0);
      tl.fromTo("#m-t1", { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);
      tl.fromTo("#m-ti", { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);
      tl.fromTo(["#m-c1", "#m-c2"], { y: 40, opacity: 0 }, { y: 40, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(["#m-b-enseigne", "#m-b-auvent", "#m-b-baie", "#m-b-etag-g", "#m-b-etag-d", "#m-b-plateau", "#m-b-fente"],
        { strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 1, duration: 0.01 }, 0);
      tl.fromTo(["#m-b-texte", "#m-b-rayures", "#m-b-objets", "#m-b-comptoir", "#m-tel", "#m-ondes"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(".piece", { x: 540, y: 1122, scale: 0, rotation: 0, opacity: 1 }, { x: 540, y: 1122, scale: 0, rotation: 0, opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#m-tel", { rotation: 0, svgOrigin: "830 1250" }, { rotation: 0, svgOrigin: "830 1250", duration: 0.01 }, 0);
      tl.fromTo("#m-tel-ecran", { fill: "rgba(245,243,238,0.08)" }, { fill: "rgba(245,243,238,0.08)", duration: 0.01 }, 0);
      tl.fromTo(".bulle", { x: 540, y: 995, scale: 0, rotation: 0, opacity: 1 }, { x: 540, y: 995, scale: 0, rotation: 0, opacity: 1, duration: 0.01 }, 0);

      // Plan 1 : la tour vit, les fenêtres s'allument une à une
      const ordre = [17, 6, 11, 2, 19, 8, 13, 0, 15, 4, 9, 18, 1, 12, 7, 16, 3, 10, 14, 5];
      ordre.forEach((i, n) => {
        tl.fromTo(lum[i], { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.08, ease: "none" }, 0.2 + n * 0.125);
      });
      tl.fromTo("#m-feu", { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "sine.inOut", repeat: 4, yoyo: true }, 0.2);

      // Plan 2 : « Non. » Le mot est barré, la tour rentre dans le sol
      tl.fromTo("#m-rature", { clipPath: "inset(0 100% 0 0)" }, { immediateRender: false, clipPath: "inset(0 0% 0 0)", duration: 0.32, ease: "power2.out" }, 2.91);
      tl.fromTo(["#m-a1", "#m-a2", "#m-a3", "#m-a4"], { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.42, ease: "power3.in", stagger: 0.05 }, 3.32);
      // cinq étages, puis le toit et l'antenne : chaque palier s'enfonce d'un coup sec
      const paliers = [62, 124, 186, 248, 310, 430];
      paliers.forEach((y, k) => {
        tl.fromTo("#m-haut", { y: k ? paliers[k - 1] : 0 }, { immediateRender: false, y: y, duration: k === 5 ? 0.24 : 0.19, ease: "power2.in" }, 3.05 + k * 0.24);
      });
      tl.fromTo("#m-voisin-a", { y: 0 }, { y: 360, duration: 0.9, ease: "power2.in" }, 3.2);
      tl.fromTo("#m-voisin-b", { y: 0 }, { y: 260, duration: 0.8, ease: "power2.in" }, 3.45);

      // Le rez-de-chaussée devient une boutique
      tl.fromTo("#m-hall", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 4.05);
      tl.fromTo("#m-b-enseigne", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 4.2);
      tl.fromTo("#m-b-texte", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.3 }, 4.5);
      tl.fromTo("#m-b-auvent", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 4.3);
      tl.fromTo("#m-b-rayures", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.3 }, 4.75);
      tl.fromTo(["#m-b-baie", "#m-b-etag-g", "#m-b-etag-d", "#m-b-plateau"], { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 4.45);
      tl.fromTo("#m-b-comptoir", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.25 }, 4.6);
      tl.fromTo("#m-b-objets", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.3 }, 4.75);
      tl.fromTo("#m-b-fente", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.3 }, 4.85);
      tl.fromTo("#m-tel", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.25 }, 4.95);

      // La caméra suit la tour qui descend, puis pousse sur la boutique
      tl.fromTo(scene, { attr: { viewBox: "0 0 1080 1920" }, "--sw": 3.5 }, { attr: { viewBox: "0 0 1080 1920" }, "--sw": 3.5, duration: 0.01 }, 0);
      tl.fromTo(scene, { attr: { viewBox: "0 0 1080 1920" }, "--sw": 3.5 }, { immediateRender: false, attr: { viewBox: "470 538.3 720 1280" }, "--sw": 2.6, duration: 1.4, ease: "power2.inOut" }, 3.8);
      tl.fromTo(scene, { attr: { viewBox: "470 538.3 720 1280" }, "--sw": 2.6 }, { immediateRender: false, attr: { viewBox: "622.3 838.5 415.4 738.5" }, "--sw": 1.75, duration: 1.05, ease: "power2.inOut" }, 5.85);

      // « À ta taille. »
      tl.fromTo("#m-t1", { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.7, ease: "expo.out" }, 5.03);
      tl.fromTo("#m-t1", { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.3, ease: "power3.in" }, 6.3);

      // Plan 3 : ce qui te fait perdre
      tl.fromTo("#m-ti", { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.7, ease: "expo.out" }, 6.55);
      const buzz = (t) => {
        tl.fromTo("#m-tel", { rotation: 0, svgOrigin: "830 1250" }, { immediateRender: false, keyframes: { rotation: [0, 4, -4, 4, -4, 3, 0] }, duration: 0.42, ease: "none" }, t);
        tl.fromTo("#m-ondes", { opacity: 0 }, { immediateRender: false, keyframes: { opacity: [0, 1, 1, 0] }, duration: 0.46, ease: "none" }, t);
        tl.fromTo("#m-tel-ecran", { fill: "rgba(245,243,238,0.08)" }, { immediateRender: false, keyframes: { fill: ["rgba(245,243,238,0.08)", "rgba(245,243,238,0.45)", "rgba(245,243,238,0.08)"] }, duration: 0.5, ease: "none" }, t);
      };
      buzz(6.87); buzz(8.91); buzz(9.51);

      // Les pièces glissent par la fente, tombent et roulent hors de la boutique
      const roule = (id, t, dx, tours, dur) => {
        tl.fromTo(id, { scale: 0, x: 540, y: 1122 }, { immediateRender: false, scale: 1, y: 1150, duration: 0.16, ease: "power1.in" }, t);
        tl.fromTo(id, { y: 1150 }, { immediateRender: false, y: 1174, duration: 0.12, ease: "power2.in" }, t + 0.16);
        tl.fromTo(id, { y: 1174 }, { immediateRender: false, keyframes: { y: [1174, 1150, 1174] }, duration: 0.24, ease: "none" }, t + 0.28);
        tl.fromTo(id, { x: 540, rotation: 0 }, { immediateRender: false, x: 540 + dx, rotation: tours * 360 * Math.sign(dx), duration: dur, ease: "sine.in" }, t + 0.22);
      };
      roule("#m-p1", 6.87, -640, 1.6, 1.05);
      roule("#m-p2", 7.03, 640, 1.7, 1.0);
      roule("#m-p3", 7.2, -600, 1.4, 1.1);
      roule("#m-p4", 9.51, 620, 1.5, 0.85);
      roule("#m-p5", 9.6, -620, 1.6, 0.85);
      roule("#m-p6", 9.69, 600, 1.4, 0.8);
      roule("#m-p7", 9.78, -600, 1.3, 0.8);

      // Les messages s'échappent du téléphone et tombent
      const fuite = (id, t, x, y, rot) => {
        tl.fromTo(id, { scale: 0.2, x: 540, y: 995 }, { immediateRender: false, scale: 1, x: x, y: y, duration: 0.4, ease: "expo.out" }, t);
        tl.fromTo(id, { y: y, rotation: 0, opacity: 1 }, { immediateRender: false, y: y + 1000, rotation: rot, opacity: 0, duration: 1.0, ease: "power2.in" }, t + 0.5);
      };
      fuite("#m-bu1", 8.91, 300, 610, -24);
      fuite("#m-bu2", 9.0, 560, 548, 14);
      fuite("#m-bu3", 9.09, 800, 622, 28);

      // Les pastilles, sur les mots
      tl.fromTo("#m-c1", { y: 40, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 8.91);
      tl.fromTo("#m-c2", { y: 40, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 9.51);

      // Plan 4 : « Alors » : le titre part, la caméra entre dans l'écran du téléphone
      tl.fromTo("#m-ti", { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.35, ease: "power3.in" }, 10.1);
      tl.fromTo(["#m-c1", "#m-c2"], { y: 0, opacity: 1 }, { immediateRender: false, y: -50, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 10.12);
      tl.fromTo(scene, { attr: { viewBox: "622.3 838.5 415.4 738.5" }, "--sw": 1.75 }, { immediateRender: false, attr: { viewBox: "770 1114.3 120 213.3" }, "--sw": 0.6, duration: 0.65, ease: "expo.inOut" }, 10.1);
      tl.fromTo("#m-tout", { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.28, ease: "power1.in" }, 10.2);

      window.__timelines["monde"] = tl;
    })();
  </script>
