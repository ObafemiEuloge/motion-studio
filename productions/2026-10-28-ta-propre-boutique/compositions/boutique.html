lass="pt" cx="602" cy="1150" r="4" /><circle class="pt" cx="622" cy="1150" r="4" /><circle class="pt" cx="642" cy="1150" r="4" /><circle class="pt" cx="662" cy="1150" r="4" /><circle class="pt" cx="682" cy="1150" r="4" /><circle class="pt" cx="702" cy="1150" r="4" /><circle class="pt" cx="542" cy="1170" r="4" /><circle class="pt" cx="562" cy="1170" r="4" /><circle class="pt" cx="582" cy="1170" r="4" /><circle class="pt" cx="602" cy="1170" r="4" /><circle class="pt" cx="622" cy="1170" r="4" /><circle class="pt" cx="642" cy="1170" r="4" /><circle class="pt" cx="662" cy="1170" r="4" /><circle class="pt" cx="682" cy="1170" r="4" /><circle class="pt" cx="702" cy="1170" r="4" /><circle class="pt" cx="542" cy="1190" r="4" /><circle class="pt" cx="562" cy="1190" r="4" /><circle class="pt" cx="582" cy="1190" r="4" /><circle class="pt" cx="602" cy="1190" r="4" /><circle class="pt" cx="622" cy="1190" r="4" /><circle class="pt" cx="642" cy="1190" r="4" /><circle class="pt" cx="662" cy="1190" r="4" /><circle class="pt" cx="682" cy="1190" r="4" /><circle class="pt" cx="562" cy="1210" r="4" /><circle class="pt" cx="582" cy="1210" r="4" /><circle class="pt" cx="602" cy="1210" r="4" /><circle class="pt" cx="622" cy="1210" r="4" /><circle class="pt" cx="642" cy="1210" r="4" /><circle class="pt" cx="662" cy="1210" r="4" /><circle class="pt" cx="562" cy="1230" r="4" /><circle class="pt" cx="582" cy="1230" r="4" /><circle class="pt" cx="602" cy="1230" r="4" /><circle class="pt" cx="622" cy="1230" r="4" /><circle class="pt" cx="642" cy="1230" r="4" /></g>
      <g id="b-allumes"></g>
      <g id="b-cle"><circle cx="0" cy="0" r="13" fill="none" stroke="#F5F3EE" stroke-width="3.5" /><path d="M13 0 H40 M30 0 V9 M37 0 V7" fill="none" stroke="#F5F3EE" stroke-width="3.5" stroke-linecap="round" /></g>
    </svg>
    <div class="compte" id="b-k1" data-layout-allow-overlap>
      <div class="mask"><span class="in eb" id="b-k1a">Près de</span></div>
      <div class="mask"><span class="in n" id="b-k1b"><span class="roule" id="b-r17">17</span></span></div>
      <div class="mask"><span class="in lab" id="b-k1c">pays africains</span></div>
    </div>
    <div class="compte" id="b-k2" data-layout-allow-overlap>
      <div class="mask"><span class="in eb" id="b-k2a">Près de</span></div>
      <div class="mask"><span class="in n" id="b-k2b"><span class="roule" id="b-r50">50</span></span></div>
      <div class="mask"><span class="in lab" id="b-k2c">opérateurs</span></div>
    </div>
    <div id="b-acces" class="ombre"><div class="mask"><span class="in l-acces" id="b-a">Je t'aide à obtenir tes accès.</span></div></div>
  </div>
  <script>
    (function () {
      const DEBUT = 36.4;
      // Les 17 pays allumés (coordonnées de la trame, calculées par outils/carte.py)
      const ALLUMES = [[182, 710], [262, 730], [222, 750], [302, 790], [342, 730], [362, 790], [382, 770], [382, 730], [442, 770], [482, 810], [482, 870], [522, 890], [602, 910], [702, 850], [762, 870], [742, 930], [662, 1030]];
      const NS = "http://www.w3.org/2000/svg", g = document.getElementById("b-allumes"), feux = [], anneaux = [];
      ALLUMES.forEach(([x, y]) => {
        const a = document.createElementNS(NS, "circle"); a.setAttribute("cx", x); a.setAttribute("cy", y); a.setAttribute("r", "16");
        a.setAttribute("fill", "none"); a.setAttribute("stroke", "#F5F3EE"); a.setAttribute("stroke-width", "2"); g.appendChild(a); anneaux.push(a);
        const f = document.createElementNS(NS, "circle"); f.setAttribute("cx", x); f.setAttribute("cy", y); f.setAttribute("r", "8"); f.setAttribute("fill", "#F5F3EE"); g.appendChild(f); feux.push(f);
      });
      // Outils communs : temps du film -> temps de la scène, chiffres qui roulent
      const at = (g) => +(g - DEBUT).toFixed(3);
      const rouleaux = {};
      document.querySelectorAll("#root .roule").forEach((el) => {
        const txt = el.textContent; el.textContent = ""; const rails = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span"); col.className = "col";
            const rail = document.createElement("span");
            for (let d = 0; d < 10; d++) { const s = document.createElement("span"); s.textContent = d; rail.appendChild(s); }
            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : ""; s.textContent = ch === " " ? " " : ch; el.appendChild(s); }
        }
        rouleaux[el.id] = rails;
      });
      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur || 1.0, ease: "expo.out" }, t + i * (dec === undefined ? 0.05 : dec));
      });
      const chiffres = (id) => rouleaux[id].map((r) => r.d);
      const zeros = (id) => rouleaux[id].map(() => 0);
      // Entrée et sortie de texte par cache
      const entre = (sel, t, dec) => tl.fromTo(sel, { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.8, ease: "expo.out", stagger: dec === undefined ? 0.08 : dec }, t);
      const sort = (sel, t) => tl.fromTo(sel, { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.38, ease: "power3.in", stagger: 0.04 }, t);
      const cache = (sel) => tl.fromTo(sel, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);

      cache(["#b-t1", "#b-t2", "#b-m1", "#b-m2", "#b-k1a", "#b-k1b", "#b-k1c", "#b-k2a", "#b-k2b", "#b-k2c", "#b-a"]);
      tl.fromTo("#b-tel", { y: 220, opacity: 0, x: 0, scale: 1 }, { y: 220, opacity: 0, x: 0, scale: 1, duration: 0.01 }, 0);
      tl.fromTo("#b-url-t", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 100% 0 0)", duration: 0.01 }, 0);
      tl.fromTo(["#b-nav", "#b-h1", "#b-h2", "#b-h3", "#b-h4", "#b-btn", "#b-c1", "#b-c2"], { y: 26, opacity: 0 }, { y: 26, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#b-trame", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(feux, { scale: 0, transformOrigin: "50% 50%" }, { scale: 0, transformOrigin: "50% 50%", duration: 0.01 }, 0);
      tl.fromTo(anneaux, { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" }, { scale: 0.5, opacity: 0, transformOrigin: "50% 50%", duration: 0.01 }, 0);
      tl.fromTo("#b-cle", { x: ALLUMES[0][0] - 60, y: ALLUMES[0][1] - 50, opacity: 0 }, { x: ALLUMES[0][0] - 60, y: ALLUMES[0][1] - 50, opacity: 0, duration: 0.01 }, 0);
      pose("b-r17", [0, 0]); pose("b-r50", [0, 0]);

      // « Alors je te propose autre chose » : ta boutique se monte
      tl.fromTo("#b-tel", { y: 220, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, at(36.65));
      tl.fromTo("#b-url-t", { clipPath: "inset(0 100% 0 0)" }, { immediateRender: false, clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "steps(10)" }, at(37.1));
      tl.fromTo("#b-nav", { y: 26, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, at(38.2));
      entre("#b-t1", at(38.67));
      tl.fromTo(["#b-h1", "#b-h2", "#b-h3", "#b-h4", "#b-btn"], { y: 26, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.6, ease: "expo.out", stagger: 0.09 }, at(38.85));
      tl.fromTo(["#b-c1", "#b-c2"], { y: 26, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.6, ease: "expo.out", stagger: 0.1 }, at(39.4));
      // « À ton nom » : l'adresse et le nom de la boutique battent une fois
      entre("#b-t2", at(40.04));
      tl.fromTo(["#b-url", "#b-logo"], { scale: 1 }, { immediateRender: false, keyframes: { scale: [1, 1.07, 1] }, duration: 0.45, ease: "power2.out", stagger: 0.08 }, at(40.04));

      // « Tes clients paient par Mobile Money ou par carte »
      sort(["#b-t1", "#b-t2"], at(40.85));
      tl.fromTo("#b-tel", { x: 0, scale: 1 }, { immediateRender: false, x: -230, scale: 0.84, duration: 0.8, ease: "power3.inOut" }, at(40.9));
      entre("#b-m1", at(41.79));
      entre("#b-m2", at(42.67));
      // « Près de dix-sept pays africains » : la boutique s'efface, l'Afrique s'allume
      sort(["#b-m1", "#b-m2"], at(43.2));
      tl.fromTo("#b-tel", { opacity: 1, y: 0 }, { immediateRender: false, opacity: 0, y: 60, duration: 0.4, ease: "power3.in" }, at(43.15));
      tl.fromTo("#b-trame", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.6, ease: "power1.out" }, at(43.3));
      entre(["#b-k1a", "#b-k1b", "#b-k1c"], at(43.44), 0.07);
      roule("b-r17", [0, 0], [1, 7], at(43.92), 1.0, 0.05);
      tl.fromTo(feux, { scale: 0 }, { immediateRender: false, scale: 1, duration: 0.35, ease: "back.out(2.5)", stagger: 0.035 }, at(43.92));
      tl.fromTo(anneaux, { scale: 0.5, opacity: 0 }, { immediateRender: false, keyframes: { scale: [0.5, 1.4], opacity: [0, 0.9, 0] }, duration: 0.8, ease: "power1.out", stagger: 0.035 }, at(43.95));
      // « près de cinquante opérateurs »
      entre(["#b-k2a", "#b-k2b", "#b-k2c"], at(45.32), 0.07);
      roule("b-r50", [0, 0], [5, 0], at(45.76), 1.0, 0.05);

      // « Et je t'aide à obtenir tes accès » : une clé ouvre les pays un à un
      entre("#b-a", at(47.23));
      const visites = [0, 4, 8, 9, 12, 14];
      tl.fromTo("#b-cle", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.25 }, at(47.0));
      visites.forEach((k, i) => {
        const [x, y] = ALLUMES[k], t = at(47.1 + i * 0.44);
        if (i > 0) { const [px, py] = ALLUMES[visites[i - 1]];
          tl.fromTo("#b-cle", { x: px - 60, y: py - 50 }, { immediateRender: false, x: x - 60, y: y - 50, duration: 0.3, ease: "power2.inOut" }, t - 0.3); }
        tl.fromTo(anneaux[k], { scale: 0.5, opacity: 0 }, { immediateRender: false, scale: 1.1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, t);
      });

      // Sortie
      sort(["#b-k1a", "#b-k1b", "#b-k1c", "#b-k2a", "#b-k2b", "#b-k2c", "#b-a"], at(49.9));
      tl.fromTo(["#b-carte"], { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.4, ease: "power1.in" }, at(49.9));
      window.__timelines["boutique"] = tl;
    })();
  </script>
