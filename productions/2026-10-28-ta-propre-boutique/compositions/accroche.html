  <script>
    (function () {
      const DEBUT = 0;
      // Outils communs : temps du film -> temps de la scène, chiffres qui roulent
      // Les temps du film sont ceux de la prise v1 ; la nouvelle première phrase (« ou tes produits digitaux »)
      // décale tout ce qui suit 1,5 s de DECALAGE secondes (voir audio/voix.alignment.json).
      const DECALAGE = 1.34;
      const recale = (g) => (g > 1.5 ? g + DECALAGE : g);
      const at = (g) => +(recale(g) - recale(DEBUT)).toFixed(3);
      const rouleaux = {};
      document.querySelectorAll("#root .roule").forEach((el) => {
        const txt = el.textContent; el.textContent = ""; const rails = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span"); col.className = "col";
            const rail = document.createElement("span");
            for (let d = 0; d < 10; d++) { const s = document.createElement("span"); s.textContent = d; rail.appendChild(s); }
            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : ""; s.textContent = ch === " " ? " " : ch; el.appendChild(s); }
        }
        rouleaux[el.id] = rails;
      });
      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur || 1.0, ease: "expo.out" }, t + i * (dec === undefined ? 0.05 : dec));
      });
      const chiffres = (id) => rouleaux[id].map((r) => r.d);
      const zeros = (id) => rouleaux[id].map(() => 0);
      // Entrée et sortie de texte par cache
      const entre = (sel, t, dec) => tl.fromTo(sel, { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.8, ease: "expo.out", stagger: dec === undefined ? 0.08 : dec }, t);
      const sort = (sel, t) => tl.fromTo(sel, { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.38, ease: "power3.in", stagger: 0.04 }, t);
      const cache = (sel) => tl.fromTo(sel, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);

      // État de départ : tout est lisible dès l'image 0
      tl.fromTo("#a-trait", { strokeDasharray: "1 1", strokeDashoffset: 1, opacity: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 1, opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#a-part", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#a-autre", { y: 0, scale: 1, opacity: 0 }, { y: 0, scale: 1, opacity: 0, duration: 0.01 }, 0);
      // « sur chaque vente » : une autre vente arrive derrière, puis une troisième
      tl.fromTo("#a-autre", { y: 0, scale: 1, opacity: 0 }, { immediateRender: false, y: 34, scale: 0.94, opacity: 0.55, duration: 0.6, ease: "expo.out" }, at(2.28));
      tl.fromTo("#a-reste", { y: 0 }, { immediateRender: false, keyframes: { y: [0, -10, 0] }, duration: 0.5, ease: "power2.out" }, at(2.28));
      // La vente vient d'arriver : le point de notification bat une fois
      tl.fromTo(".notif .pt", { scale: 1 }, { keyframes: { scale: [1, 1.6, 1] }, duration: 0.5, ease: "power2.out" }, 0.25);
      // « sert » : une lame fine découpe la part de la plateforme
      tl.fromTo("#a-trait", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.16, ease: "power2.in" }, at(3.9));

      tl.fromTo("#a-part", { x: 0, y: 0, rotation: 0, opacity: 1 },
        { immediateRender: false, x: 150, y: 330, rotation: 14, opacity: 0, duration: 0.85, ease: "power2.in" }, at(4.1));
      // Sortie vers l'histoire
      sort(["#a-1", "#a-2", "#a-3"], at(4.62));
      tl.fromTo(["#a-reste", "#a-autre"], { opacity: 1 }, { immediateRender: false, y: -40, opacity: 0, duration: 0.35, ease: "power3.in" }, at(4.68));
      window.__timelines["accroche"] = tl;
    })();
