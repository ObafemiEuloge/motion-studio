  </style>

  <script>
    (function () {
      const DEBUT = 50.0;
      // Outils communs : temps du film -> temps de la scène, chiffres qui roulent
      // Les temps du film sont ceux de la prise v1 ; la nouvelle première phrase (« ou tes produits digitaux »)
      // décale tout ce qui suit 1,5 s de DECALAGE secondes (voir audio/voix.alignment.json).
      const DECALAGE = 1.34;
      const recale = (g) => (g > 1.5 ? g + DECALAGE : g);
      const at = (g) => +(recale(g) - recale(DEBUT)).toFixed(3);
      const rouleaux = {};
      document.querySelectorAll("#root .roule").forEach((el) => {
        const txt = el.textContent; el.textContent = ""; const rails = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span"); col.className = "col";
            const rail = document.createElement("span");
            for (let d = 0; d < 10; d++) { const s = document.createElement("span"); s.textContent = d; rail.appendChild(s); }
            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : ""; s.textContent = ch === " " ? " " : ch; el.appendChild(s); }
        }
        rouleaux[el.id] = rails;
      });
      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur || 1.0, ease: "expo.out" }, t + i * (dec === undefined ? 0.05 : dec));
      });
      const chiffres = (id) => rouleaux[id].map((r) => r.d);
      const zeros = (id) => rouleaux[id].map(() => 0);
      // Entrée et sortie de texte par cache
      const entre = (sel, t, dec) => tl.fromTo(sel, { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.8, ease: "expo.out", stagger: dec === undefined ? 0.08 : dec }, t);
      const sort = (sel, t) => tl.fromTo(sel, { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.38, ease: "power3.in", stagger: 0.04 }, t);
      const cache = (sel) => tl.fromTo(sel, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);

      cache(["#c-ta", "#c-pr", "#c-tb1", "#c-tb2", "#c-tc1", "#c-tc2"]);
      tl.fromTo([".montant"], { y: 80, opacity: 0 }, { y: 80, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#c-egal", { scale: 0.5, opacity: 0 }, { scale: 0.5, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(["#c-ligne", "#c-x-moi", "#c-x-plat"], { strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 1, duration: 0.01 }, 0);
      tl.fromTo(["#c-b-moi", "#c-b-plat"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(".noeud", { scale: 0.8, opacity: 0 }, { scale: 0.8, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#c-piece", { x: 540, y: 640, scale: 0, opacity: 1 }, { x: 540, y: 640, scale: 0, opacity: 1, duration: 0.01 }, 0);
      tl.fromTo(["#c-c1", "#c-c2"], { yPercent: 0 }, { yPercent: 0, duration: 0.01 }, 0);
      tl.fromTo("#c-espace", { y: 120, opacity: 0 }, { y: 120, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#c-courbe", { clipPath: "inset(0px 520px 0px 0px)" }, { clipPath: "inset(0px 520px 0px 0px)", duration: 0.01 }, 0);
      tl.fromTo("#c-cb-pt", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(["#c-o1", "#c-o2", "#c-o3"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(["#c-l1", "#c-l2", "#c-l3"], { opacity: 0, y: 20 }, { opacity: 0, y: 20, duration: 0.01 }, 0);

      // A. « Ton client paie exactement le montant affiché, au franc près »
      tl.fromTo("#c-aff", { y: 80, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, at(50.3));
      tl.fromTo("#c-pay", { y: 80, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, at(50.71));
      entre("#c-ta", at(51.03));
      tl.fromTo("#c-egal", { scale: 0.5, opacity: 0 }, { immediateRender: false, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, at(51.79));
      entre("#c-pr", at(52.91));
      sort(["#c-ta", "#c-pr"], at(53.62));
      tl.fromTo([".montant", "#c-egal"], { opacity: 1 }, { immediateRender: false, opacity: 0, y: -40, duration: 0.35, ease: "power3.in", stagger: 0.03 }, at(53.62));

      // B. « Et l'argent arrive sur ton compte. Pas chez moi, pas chez une plateforme : chez toi. »
      entre(["#c-tb1", "#c-tb2"], at(53.99));
      tl.fromTo(["#c-n-client", "#c-n-compte"], { scale: 0.8, opacity: 0 }, { immediateRender: false, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out", stagger: 0.1 }, at(54.0));
      tl.fromTo("#c-ligne", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, at(54.2));
      tl.fromTo("#c-piece", { scale: 0 }, { immediateRender: false, scale: 1, duration: 0.4, ease: "back.out(2)" }, at(54.47));
      tl.fromTo("#c-piece", { y: 640 }, { immediateRender: false, y: 878, duration: 0.9, ease: "power2.inOut" }, at(54.79));
      // « Pas chez moi » : le détour vers moi est barré
      tl.fromTo("#c-n-moi", { scale: 0.8, opacity: 0 }, { immediateRender: false, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, at(55.75));
      tl.fromTo("#c-b-moi", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.25 }, at(55.85));
      tl.fromTo("#c-x-moi", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at(56.13));
      tl.fromTo(["#c-n-moi", "#c-b-moi"], { opacity: 1 }, { immediateRender: false, opacity: 0.35, duration: 0.3 }, at(56.4));
      // « pas chez une plateforme »
      tl.fromTo("#c-n-plat", { scale: 0.8, opacity: 0 }, { immediateRender: false, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, at(56.62));
      tl.fromTo("#c-b-plat", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.25 }, at(56.72));
      tl.fromTo("#c-x-plat", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at(57.06));
      tl.fromTo(["#c-n-plat", "#c-b-plat"], { opacity: 1 }, { immediateRender: false, opacity: 0.35, duration: 0.3 }, at(57.35));
      // « chez toi » : l'argent arrive
      tl.fromTo("#c-piece", { y: 878 }, { immediateRender: false, y: 1228, duration: 0.5, ease: "power3.in" }, at(57.35));
      tl.fromTo("#c-piece", { scale: 1 }, { immediateRender: false, scale: 0, duration: 0.15, ease: "power2.in" }, at(57.8));
      tl.fromTo(["#c-c1", "#c-c2"], { yPercent: 0 }, { immediateRender: false, yPercent: -100, duration: 0.5, ease: "expo.out" }, at(57.84));
      tl.fromTo("#c-n-compte", { scale: 1 }, { immediateRender: false, keyframes: { scale: [1, 1.08, 1] }, duration: 0.4, ease: "power2.out" }, at(57.84));
      sort(["#c-tb1", "#c-tb2"], at(58.5));
      tl.fromTo(["#c-flux", ".noeud"], { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.35, ease: "power1.in" }, at(58.5));

      // C. « Tes produits, tes ventes, tes clients : tu vois tout, tu gères tout. Et ta boutique grandit avec toi. »
      tl.fromTo("#c-espace", { y: 120, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, at(58.55));
      [["#c-o1", "#c-l1", 58.91], ["#c-o2", "#c-l2", 59.63], ["#c-o3", "#c-l3", 60.43]].forEach(([o, l, t], i, tout) => {
        tl.fromTo(o, { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.2 }, at(t));
        tl.fromTo(l, { opacity: 0, y: 20 }, { immediateRender: false, opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, at(t + (i > 0 ? 0.12 : 0)));
        if (i > 0) {
          tl.fromTo(tout[i - 1][0], { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.2 }, at(t));
          tl.fromTo(tout[i - 1][1], { opacity: 1, y: 0 }, { immediateRender: false, opacity: 0, y: -20, duration: 0.12, ease: "power2.in" }, at(t));
        }
      });
      entre("#c-tc1", at(61.11));
      entre("#c-tc2", at(62.02));
      // « grandit avec toi » : la courbe des ventes monte
      tl.fromTo("#c-courbe", { clipPath: "inset(0px 520px 0px 0px)" }, { immediateRender: false, clipPath: "inset(0px 0px 0px 0px)", duration: 1.0, ease: "power2.inOut" }, at(63.29));
      tl.fromTo("#c-cb-pt", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.2 }, at(64.2));
      // Sortie vers le calcul
      sort(["#c-tc1", "#c-tc2"], at(64.55));
      tl.fromTo("#c-espace", { opacity: 1, y: 0 }, { immediateRender: false, opacity: 0, y: -60, duration: 0.35, ease: "power3.in" }, at(64.55));
      window.__timelines["confiance"] = tl;
    })();
  </script>
