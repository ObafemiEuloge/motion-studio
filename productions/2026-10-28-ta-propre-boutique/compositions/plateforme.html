  <script>
    (function () {
      const DEBUT = 10.6;
      // Outils communs : temps du film -> temps de la scène, chiffres qui roulent
      const at = (g) => +(g - DEBUT).toFixed(3);
      const rouleaux = {};
      document.querySelectorAll("#root .roule").forEach((el) => {
        const txt = el.textContent; el.textContent = ""; const rails = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span"); col.className = "col";
            const rail = document.createElement("span");
            for (let d = 0; d < 10; d++) { const s = document.createElement("span"); s.textContent = d; rail.appendChild(s); }
            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : ""; s.textContent = ch === " " ? " " : ch; el.appendChild(s); }
        }
        rouleaux[el.id] = rails;
      });
      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur || 1.0, ease: "expo.out" }, t + i * (dec === undefined ? 0.05 : dec));
      });
      const chiffres = (id) => rouleaux[id].map((r) => r.d);
      const zeros = (id) => rouleaux[id].map(() => 0);
      // Entrée et sortie de texte par cache
      const entre = (sel, t, dec) => tl.fromTo(sel, { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.8, ease: "expo.out", stagger: dec === undefined ? 0.08 : dec }, t);
      const sort = (sel, t) => tl.fromTo(sel, { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.38, ease: "power3.in", stagger: 0.04 }, t);
      const cache = (sel) => tl.fromTo(sel, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);

      cache(["#p-t", "#p-l1", "#p-l2", "#p-l3"]);
      tl.fromTo("#p-cadre", { opacity: 0, scale: 1.06, x: 0, y: 0 }, { opacity: 0, scale: 1.06, x: 0, y: 0, duration: 0.01 }, 0);
      tl.fromTo("#p-rangee", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      // La fiche de l'établi : même taille et même place qu'à la fin de la scène précédente
      tl.fromTo("#p-ta", { x: 0, y: 60, scale: 0.38, opacity: 0 }, { x: 0, y: 60, scale: 0.38, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(".coche .v", { strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 1, duration: 0.01 }, 0);
      tl.fromTo(".coche svg", { scale: 0.6, opacity: 0 }, { scale: 0.6, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo([".coche .rond", ".coche .v"], { stroke: "#D9C6A3" }, { stroke: "#D9C6A3", duration: 0.01 }, 0);

      // « Tu l'as mise sur une plateforme de vente » : la vitrine apparaît, ta fiche s'y range
      tl.fromTo("#p-cadre", { opacity: 0, scale: 1.06 }, { immediateRender: false, opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, at(10.8));
      tl.fromTo("#p-ta", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.02 }, at(11.17));
      // Centre du trou : (532, 935) ; ta fiche (700 × 620) devient une fiche de 232 × 210
      tl.fromTo("#p-ta", { x: 0, y: 60, scale: 0.38 }, { immediateRender: false, x: -8, y: 155, scale: 0.335, duration: 0.5, ease: "power3.inOut" }, at(11.17));
      tl.fromTo("#p-rangee", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.15 }, at(11.6));
      tl.fromTo("#p-ta", { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.15 }, at(11.62));
      // « c'est pratique » : la vitrine recule et monte, les coches arrivent sur leurs mots
      tl.fromTo("#p-cadre", { scale: 1, y: 0 }, { immediateRender: false, scale: 0.66, y: -140, duration: 0.9, ease: "power3.inOut" }, at(12.5));
      entre("#p-t", at(13.25));
      [["#p-c1", "#p-l1", 14.65], ["#p-c2", "#p-l2", 16.45], ["#p-c3", "#p-l3", 17.53]].forEach(([c, l, t], i, tout) => {
        tl.fromTo(c + " svg", { scale: 0.6, opacity: 0 }, { immediateRender: false, scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, at(t));
        tl.fromTo(c + " .v", { strokeDashoffset: 1 }, { immediateRender: false, strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at(t + 0.1));
        entre(l, at(t));
        // la coche précédente redevient blanc cassé : une seule coche champagne à la fois
        if (i > 0) tl.fromTo([tout[i - 1][0] + " .rond", tout[i - 1][0] + " .v"], { stroke: "#D9C6A3" }, { immediateRender: false, stroke: "#F5F3EE", duration: 0.3 }, at(t));
      });

      // « Mais à chaque vente » : tout part, la vitrine se réduit au point « Plateforme »
      sort(["#p-t", "#p-l1", "#p-l2", "#p-l3"], at(18.2));
      tl.fromTo(".coche svg", { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.3 }, at(18.2));
