            const rail = document.createElement("span");

            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });

        }
        rouleaux[el.id] = rails;
      });
      // L'anneau : douze mois, un segment par mois
      const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("d-anneau-svg"), mois = [];

        const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
      for (let m = 0; m < 12; m++) {
        const a0 = m * 30 + 3, a1 = m * 30 + 27;
        const fond = document.createElementNS(NS, "path"); fond.setAttribute("d", arc(a0, a1, 228)); fond.setAttribute("fill", "none");
        fond.setAttribute("stroke", "rgba(245,243,238,0.14)"); fond.setAttribute("stroke-width", "22"); fond.setAttribute("stroke-linecap", "round"); svg.appendChild(fond);
        const plein = document.createElementNS(NS, "path"); plein.setAttribute("d", arc(a0, a1, 228)); plein.setAttribute("fill", "none"); plein.setAttribute("pathLength", "1");
        plein.setAttribute("stroke", "#F5F3EE"); plein.setAttribute("stroke-width", "22"); plein.setAttribute("stroke-linecap", "round"); svg.appendChild(plein); mois.push(plein);
      }

      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur, ease: "expo.out" }, t + i * (dec || 0));
