    </div>
    <div id="h-pays" class="ombre" data-layout-allow-overlap>
      <div class="mask"><span class="in l-pays" id="h-p1" data-layout-ignore>Mobile Money et carte,</span></div>
      <div class="mask"><span class="in l-pays" id="h-p2">dans plusieurs pays d’Afrique.</span></div>
    </div>
  </div>
  <script>
    (function () {
      const DEBUT = 6.2;
      const ALLUMES = [[182, 710], [262, 730], [222, 750], [302, 790], [342, 730], [362, 790], [382, 770], [382, 730], [442, 770], [482, 810], [482, 870], [522, 890], [602, 910], [702, 850], [762, 870], [742, 930], [662, 1030]];
      const zone = document.getElementById("h-piliers"), piliers = [];
      ALLUMES.forEach(([x, y], i) => {
        const p = document.createElement("div"); p.className = "pil"; p.style.left = x + "px"; p.style.top = (y - 380) + "px";
        p.innerHTML = '<span class="s"></span><span class="b" style="height:' + (110 + (i * 37) % 120) + 'px"></span>';
        zone.appendChild(p); piliers.push(p);
      });
      // Outils communs : temps du film -> temps de la scène, chiffres qui roulent
      const at = (g) => +(g - DEBUT).toFixed(3);
      const rouleaux = {};
      document.querySelectorAll("#root .roule").forEach((el) => {
        const txt = el.textContent; el.textContent = ""; const rails = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span"); col.className = "col";
            const rail = document.createElement("span");
            for (let d = 0; d < 10; d++) { const s = document.createElement("span"); s.textContent = d; rail.appendChild(s); }
            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : ""; s.textContent = ch === " " ? " " : ch; el.appendChild(s); }
        }
        rouleaux[el.id] = rails;
      });
      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur || 1.0, ease: "expo.out" }, t + i * (dec === undefined ? 0.05 : dec));
      });
      const chiffres = (id) => rouleaux[id].map((r) => r.d);
      const zeros = (id) => rouleaux[id].map(() => 0);
      // Entrée et sortie de texte par cache
      const entre = (sel, t, dec) => tl.fromTo(sel, { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.8, ease: "expo.out", stagger: dec === undefined ? 0.08 : dec }, t);
      const sort = (sel, t) => tl.fromTo(sel, { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.38, ease: "power3.in", stagger: 0.04 }, t);
      const cache = (sel) => tl.fromTo(sel, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);
      // Compteurs à tambours 3D : chaque chiffre est un cylindre de dix faces (rayon 1,54 em)
      const tambours = {};
      document.querySelectorAll("#root .tambours").forEach((el) => {
        // les dix faces d'un cylindre se superposent par construction : le contrôle de mise en page ne doit pas les compter
        el.setAttribute("data-layout-ignore", "");
        const txt = el.textContent; el.textContent = ""; const cyls = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const t = document.createElement("span"); t.className = "tb";
            const c = document.createElement("span"); c.className = "cyl";
            for (let d = 0; d < 10; d++) { const f = document.createElement("span"); f.className = "fa"; f.textContent = d;
              f.style.transform = `rotateX(${-36 * d}deg) translateZ(1.54em)`; c.appendChild(f); }
            t.appendChild(c); el.appendChild(t); cyls.push({ cyl: c, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : "sym"; s.textContent = ch === " " ? "\u00A0" : ch; el.appendChild(s); }
        }
        tambours[el.id] = cyls;
      });
      const posTambour = (id, ch) => tambours[id].forEach((c, i) => tl.fromTo(c.cyl, { rotationX: 36 * ch[i] }, { rotationX: 36 * ch[i], duration: 0.01 }, 0));
      const tourne = (id, de, vers, t, dur, dec, tours) => tambours[id].forEach((c, i) => {
        tl.fromTo(c.cyl, { rotationX: 36 * de[i] }, { immediateRender: false, rotationX: 36 * vers[i] + 360 * (tours === undefined ? 1 : tours), duration: dur || 1.4, ease: "power3.out" }, t + i * (dec === undefined ? 0.06 : dec));
      });
      const chiffresT = (id) => tambours[id].map((c) => c.d);

      cache(["#h-t", "#h-e", "#h-c", "#h-l1", "#h-l2", "#h-m1", "#h-m2", "#h-p1", "#h-p2"]);
      tl.fromTo("#h-piste", { clipPath: "inset(0 100% 0 0 round 56px)" }, { clipPath: "inset(0 100% 0 0 round 56px)", duration: 0.01 }, 0);
      tl.fromTo("#h-plein", { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
      tl.fromTo("#h-scene3d", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#h-plan", { rotationX: 62, rotationZ: -14, y: 120, scale: 0.9 }, { rotationX: 62, rotationZ: -14, y: 120, scale: 0.9, duration: 0.01 }, 0);
      tl.fromTo(".pil .b", { rotationX: -90, scaleY: 0 }, { rotationX: -90, scaleY: 0, duration: 0.01 }, 0);
      tl.fromTo(".pil .s", { scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);

      // « Avec ta propre boutique, presque tout reste chez toi »
      entre("#h-t", at(6.39));
      tl.fromTo("#h-piste", { clipPath: "inset(0 100% 0 0 round 56px)" }, { immediateRender: false, clipPath: "inset(0 0% 0 0 round 56px)", duration: 0.9, ease: "expo.out" }, at(6.7));
      // « presque tout reste » : la barre se remplit presque jusqu'au bout ; le petit bout vide, ce sont les frais de paiement
      entre("#h-e", at(7.95));
      tl.fromTo("#h-plein", { scaleX: 0 }, { immediateRender: false, scaleX: 0.965, duration: 1.1, ease: "power3.inOut" }, at(7.95));
      entre("#h-c", at(8.95));
      entre(["#h-l1", "#h-l2"], at(9.05), 0.1);

      // « Mobile Money, carte » : l'Afrique se couche, des piliers se lèvent
      sort(["#h-t", "#h-e", "#h-c", "#h-l1", "#h-l2"], at(9.55));
      tl.fromTo("#h-piste", { opacity: 1 }, { immediateRender: false, opacity: 0, y: -40, duration: 0.35, ease: "power3.in" }, at(9.55));
      entre("#h-m1", at(9.71));
      entre("#h-m2", at(10.59));
      tl.fromTo("#h-scene3d", { opacity: 0 }, { immediateRender: false, opacity: 1, duration: 0.6, ease: "power1.out" }, at(9.75));
      tl.fromTo("#h-plan", { rotationX: 62, rotationZ: -14, y: 120, scale: 0.9 }, { immediateRender: false, rotationX: 52, rotationZ: 6, y: 0, scale: 1, duration: 3.3, ease: "power2.out" }, at(9.75));
      tl.fromTo(".pil .s", { scale: 0, opacity: 0 }, { immediateRender: false, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.03 }, at(11.5));
      tl.fromTo(".pil .b", { scaleY: 0 }, { immediateRender: false, scaleY: 1, duration: 0.7, ease: "expo.out", stagger: 0.035 }, at(11.59));
      entre("#h-p1", at(11.19));
      entre("#h-p2", at(11.4));

      // Sortie vers le calcul
      sort(["#h-m1", "#h-m2", "#h-p1", "#h-p2"], at(12.82));
      tl.fromTo(["#h-scene3d"], { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.35, ease: "power1.in" }, at(12.82));
      window.__timelines["chez"] = tl;
    })();
  </script>
