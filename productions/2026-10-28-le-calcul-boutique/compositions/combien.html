      <div class="mask"><span class="in l-q" id="o-q2">ta plateforme</span></div>
      <div class="mask"><span class="in l-q" id="o-q3">t'a pris</span></div>

    <div class="compteur" id="o-c1" data-layout-allow-overlap>
      <div class="mask"><span class="in eyebrow" id="o-e1">Tes ventes du mois</span></div>
      <div class="nb" id="o-n1"><span class="tambours" id="o-t1">2 000 000</span><span class="u">F</span></div>

    <div class="compteur acc" id="o-c2" data-layout-allow-overlap>
      <div class="mask"><span class="in eyebrow" id="o-e2">Ta plateforme prend jusqu'à</span></div>
      <div class="nb" id="o-n2"><span class="sym" style="margin-right:22px">−</span><span class="tambours" id="o-t2">300 000</span><span class="u">F</span></div>
    </div>
    <div id="o-mois">
      <div class="mask"><span class="in eyebrow" id="o-e3">Chaque mois</span></div>

    </div>

  <script>
    (function () {
      const DEBUT = 0;
      const bande = document.getElementById("o-bande");
      "JFMAMJJASOND".split("").forEach((l) => { const m = document.createElement("div"); m.className = "m"; m.innerHTML = `<span class="bouchee"></span>${l}`; bande.appendChild(m); });
      // Outils communs : temps du film -> temps de la scène, chiffres qui roulent
      const at = (g) => +(g - DEBUT).toFixed(3);
      const rouleaux = {};
      document.querySelectorAll("#root .roule").forEach((el) => {
        const txt = el.textContent; el.textContent = ""; const rails = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span"); col.className = "col";
            const rail = document.createElement("span");
            for (let d = 0; d < 10; d++) { const s = document.createElement("span"); s.textContent = d; rail.appendChild(s); }
            col.appendChild(rail); el.appendChild(col); rails.push({ rail, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : ""; s.textContent = ch === " " ? " " : ch; el.appendChild(s); }
        }
        rouleaux[el.id] = rails;
      });
      const tl = gsap.timeline({ paused: true });
      const pose = (id, chiffres) => rouleaux[id].forEach((r, i) => tl.fromTo(r.rail, { yPercent: -chiffres[i] * 10 }, { yPercent: -chiffres[i] * 10, duration: 0.01 }, 0));
      const roule = (id, de, vers, t, dur, dec) => rouleaux[id].forEach((r, i) => {
        if (de[i] === vers[i]) return;
        tl.fromTo(r.rail, { yPercent: -de[i] * 10 }, { immediateRender: false, yPercent: -vers[i] * 10, duration: dur || 1.0, ease: "expo.out" }, t + i * (dec === undefined ? 0.05 : dec));
      });
      const chiffres = (id) => rouleaux[id].map((r) => r.d);
      const zeros = (id) => rouleaux[id].map(() => 0);
      // Entrée et sortie de texte par cache
      const entre = (sel, t, dec) => tl.fromTo(sel, { yPercent: 130 }, { immediateRender: false, yPercent: 0, duration: 0.8, ease: "expo.out", stagger: dec === undefined ? 0.08 : dec }, t);
      const sort = (sel, t) => tl.fromTo(sel, { yPercent: 0 }, { immediateRender: false, yPercent: -135, duration: 0.38, ease: "power3.in", stagger: 0.04 }, t);
      const cache = (sel) => tl.fromTo(sel, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);
      // Compteurs à tambours 3D : chaque chiffre est un cylindre de dix faces (rayon 1,54 em)
      const tambours = {};
      document.querySelectorAll("#root .tambours").forEach((el) => {
        // les dix faces d'un cylindre se superposent par construction : le contrôle de mise en page ne doit pas les compter
        el.setAttribute("data-layout-ignore", "");
        const txt = el.textContent; el.textContent = ""; const cyls = [];
        for (const ch of txt) {
          if (/[0-9]/.test(ch)) {
            const t = document.createElement("span"); t.className = "tb";
            const c = document.createElement("span"); c.className = "cyl";
            for (let d = 0; d < 10; d++) { const f = document.createElement("span"); f.className = "fa"; f.textContent = d;
              f.style.transform = `rotateX(${-36 * d}deg) translateZ(1.54em)`; c.appendChild(f); }
            t.appendChild(c); el.appendChild(t); cyls.push({ cyl: c, d: +ch });
          } else { const s = document.createElement("span"); s.className = ch === " " ? "sep" : "sym"; s.textContent = ch === " " ? "\u00A0" : ch; el.appendChild(s); }
        }
        tambours[el.id] = cyls;
      });
      const posTambour = (id, ch) => tambours[id].forEach((c, i) => tl.fromTo(c.cyl, { rotationX: 36 * ch[i] }, { rotationX: 36 * ch[i], duration: 0.01 }, 0));
      const tourne = (id, de, vers, t, dur, dec, tours) => tambours[id].forEach((c, i) => {
        tl.fromTo(c.cyl, { rotationX: 36 * de[i] }, { immediateRender: false, rotationX: 36 * vers[i] + 360 * (tours === undefined ? 1 : tours), duration: dur || 1.4, ease: "power3.out" }, t + i * (dec === undefined ? 0.06 : dec));
      });
      const chiffresT = (id) => tambours[id].map((c) => c.d);

      cache(["#o-e1", "#o-e2", "#o-e3"]);
      posTambour("o-t1", [0, 0, 0, 0, 0, 0, 0]);
      posTambour("o-t2", [0, 0, 0, 0, 0, 0]);
      tl.fromTo(["#o-n1", "#o-n2"], { opacity: 0, y: 40 }, { opacity: 0, y: 40, duration: 0.01 }, 0);
      tl.fromTo(".m", { y: 60, opacity: 0 }, { y: 60, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(".bouchee", { scale: 0 }, { scale: 0, duration: 0.01 }, 0);

      // Image 0 : la question, en très grand ; « combien ? » respire une seule fois sur le mot
      tl.fromTo("#o-q4", { scale: 1, transformOrigin: "0% 60%" }, { keyframes: { scale: [1, 1.04, 1] }, duration: 0.6, ease: "power2.out" }, at(1.8));
      sort(["#o-q1", "#o-q2", "#o-q3", "#o-q4"], at(2.42));

      // « Sur deux millions de ventes » : les tambours font un tour complet et s'arrêtent sur 2 000 000
      entre("#o-e1", at(2.51));
      tl.fromTo("#o-n1", { opacity: 0, y: 40 }, { immediateRender: false, opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, at(2.55));
      tourne("o-t1", [0, 0, 0, 0, 0, 0, 0], [2, 0, 0, 0, 0, 0, 0], at(2.6), 1.5, 0.05, 1);
      // « c'est jusqu'à trois cent mille francs »
      entre("#o-e2", at(4.11));
      tl.fromTo("#o-n2", { opacity: 0, y: 40 }, { immediateRender: false, opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, at(4.3));
      tourne("o-t2", [0, 0, 0, 0, 0, 0], [3, 0, 0, 0, 0, 0], at(4.4), 1.4, 0.05, 1);
      // « Chaque mois » : les douze mois, chacun croqué
      entre("#o-e3", at(5.55));
      tl.fromTo(".m", { y: 60, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.5, ease: "expo.out", stagger: 0.03 }, at(5.4));
      tl.fromTo(".bouchee", { scale: 0 }, { immediateRender: false, scale: 1, duration: 0.25, ease: "back.out(2.5)", stagger: 0.045 }, at(5.7));

      // Sortie : « Avec ta propre boutique »
      sort(["#o-e1", "#o-e2", "#o-e3"], at(6.25));
      tl.fromTo(["#o-n1", "#o-n2", "#o-bande"], { opacity: 1, y: 0 }, { immediateRender: false, opacity: 0, y: -60, duration: 0.35, ease: "power3.in", stagger: 0.04 }, at(6.25));
      window.__timelines["combien"] = tl;
    })();
